name: Manual Release Dispatcher

permissions:
  contents: write

# on:
#   workflow_dispatch:
#     inputs:
#       version:
#         description: 'Semver version to release (e.g. 1.2.3 or 1.2.3-beta.1)'
#         required: true

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'use "Create Release & Publish" instead'
        required: true

jobs:
  validate_and_tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.CONTENTS_WRITE_TOKEN }}

      - name: Validate input version is valid semver
        run: |
          INPUT_VER="${{ github.event.inputs.version }}"
          if ! [[ "$INPUT_VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[[:alnum:]]+(\.[0-9]+)*)?$ ]]; then
            echo "::error::Version must be valid semver (e.g. 1.2.3 or 1.2.3-beta.1)"
            exit 1
          fi

      - name: Validate input ref exists in repository
        run: |
          INPUT_REF="${{ github.ref_name }}"
          if ! git ls-remote --exit-code --heads origin "$INPUT_REF" >/dev/null \
            && ! git ls-remote --exit-code --tags origin "$INPUT_REF" >/dev/null; then
            echo "::error::Ref '$INPUT_REF' not found on remote."
            exit 1
          fi

      - name: Validate non-prerelease input version targets develop branch only
        run: |
          VERSION="${{ github.event.inputs.version }}"
          REF="${{ github.ref_name }}"
          if [[ ! "$VERSION" =~ - ]]; then
            if [[ "$REF" != "develop" ]]; then
              echo "::error ::Non-prerelease versions must be released from 'develop'."
              exit 1
            fi
          fi

      - name: Bump version & push tag
        run: |
          VERSION="${{ github.event.inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --detach
          npm version "$VERSION"
          git push -u origin "v${VERSION}"
